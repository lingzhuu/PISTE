site_name: SpaPath
site_description: Spatial pathway inference for spatial transcriptomics with INLA
repo_url: https://github.com/lingzhuu/pathwayLGM
edit_uri: edit/dev/doc/source/
docs_dir: source

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Installation: installation.md
  - Tutorials: tutorials.md
  - Example usages: examples.md
  - About: about.md
