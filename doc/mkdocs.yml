site_name: PISTE
site_description: Pathway Inference from Spatial Transcriptomic Expression
repo_url: https://github.com/lingzhuu/PISTE
repo_name: GitHub
edit_uri: edit/main/doc/source/
docs_dir: source
copyright: PISTE · GPL-3

theme:
  name: material
  custom_dir: overrides
  logo: figures/logo.svg
  favicon: figures/logo.svg
  # Fonts are served from source/fonts (see stylesheets/extra.css)
  font: false
  features:
    - content.code.copy
    - navigation.sections
    - toc.follow

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
      toc_depth: 2
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Getting started:
      - Overview: index.md
      - Installation: installation.md
      - Quick start: usage.md
      - Web app: https://lingzhuu.github.io/PISTE/
  - Tutorials:
      - Region comparison: examples/observed.md
      - Joint sections: examples/joint_sections.md
      - Adjusted mode: examples/composition.md
      - Spatial map: examples/map.md
  - Reference:
      - Command line: cli.md
      - R API: api.md
