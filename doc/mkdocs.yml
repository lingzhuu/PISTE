site_name: PISTE
site_description: Spatial pathway inference for spatial transcriptomics with INLA
repo_url: https://github.com/lingzhuu/PISTE
edit_uri: edit/main/doc/source/
docs_dir: source

theme:
  name: material
  logo: figures/logo.svg
  favicon: figures/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.footer
    - toc.integrate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Installation: installation.md
  - Example usage: usage.md
  - Tutorials:
      - Observed mode on DLPFC: examples/observed.md
      - Joint analysis of sections on DLPFC: examples/joint_sections.md
      - Composition-adjusted mode on DLPFC: examples/composition.md
      - Spatial map on breast cancer: examples/map.md
  - Command line:
      - compare: cli/compare.md
      - compare -joint_sections: cli/compare_joint_sections.md
      - map: cli/map.md
  - R API: api.md
  - Web app: https://lingzhuu.github.io/PISTE/
